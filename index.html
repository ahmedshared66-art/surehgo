<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<script>
(function(l){if(l.search[1]==='/'){var d=l.search.slice(1).split('&').map(function(x){return x.replace(/~and~/g,'&')}).join('?');window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash)}}(window.location));
</script>
<title>منصة المواقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=sitefix-20261121-2">
<link rel="stylesheet" href="shop.css?v=sitefix-20261121-2">
<link rel="stylesheet" href="theme.css?v=sitefix-20261121-2">
</head>
<body>
<div id="app"><main id="app-loading" style="max-width:800px;margin:12vh auto;padding:24px;text-align:center;font-family:Tahoma,sans-serif">جاري تحميل الموقع…</main></div>
<script>
window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (app && app.querySelector('#app-loading')) app.innerHTML = '<main style="max-width:800px;margin:12vh auto;padding:24px;text-align:center;font-family:Tahoma,sans-serif"><h1>تعذر تحميل الموقع</h1><p>حدّث الصفحة. لو استمرت المشكلة، أرسل للدعم نص الخطأ التالي:</p><pre dir="ltr" style="white-space:pre-wrap">' + String(e.message || 'تعذر تحميل أحد ملفات الموقع') + '</pre></main>';
});
window.addEventListener('unhandledrejection', function(e) {
  var app = document.getElementById('app');
  if (app && app.querySelector('#app-loading')) app.innerHTML = '<main style="max-width:800px;margin:12vh auto;padding:24px;text-align:center;font-family:Tahoma,sans-serif"><h1>تعذر تحميل الموقع</h1><p>حدّث الصفحة. لو استمرت المشكلة، أرسل للدعم نص الخطأ التالي:</p><pre dir="ltr" style="white-space:pre-wrap">' + String(e.reason && (e.reason.message || e.reason) || 'خطأ في تحميل البيانات') + '</pre></main>';
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script src="extras.js?v=sitefix-20261121-2"></script>
<script src="app.js?v=sitefix-20261121-2"></script>
</body>
</html>
